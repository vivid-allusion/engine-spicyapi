[project]
name = "engine-spicyapi"
version = "0.1.0"
description = "Engine wrapper for the Spicy API (spicyapi.com). Uniform interface that studiolot Generators call instead of talking to the provider directly."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools]
packages = ["engine_spicyapi"]

[tool.setuptools.package-data]
engine_spicyapi = [
    "endpoints/**/*.toml",
    "endpoints/**/*.gitkeep",
    "profiles/standby/**/*.yaml",
]
