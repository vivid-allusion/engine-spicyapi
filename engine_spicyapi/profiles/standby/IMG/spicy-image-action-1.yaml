# Spicy Image Action 1 — ready-made still from GET /v1/images/actions
platform: spicyapi
endpoint: spicy-image-action-1
media_type: image
image_url_param: image_url
parameters:
  n: 1
  # Required — a still id from GET /v1/images/actions (e.g. pov-missionary):
  #action: "pov-missionary"
  # Advanced parameters (uncomment to use)
  #seed: -1
pricing:
  base_cost: 0.15
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
