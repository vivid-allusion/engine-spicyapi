# Nano Banana 2.1 · Text to Image — 1:1
platform: spicyapi
endpoint: google/nano-banana-2.1/text-to-image
media_type: image
parameters:
  resolution: "1k"
  aspect_ratio: "1:1"
  output_format: "png"
  enable_web_search: false
  official_fallback: true
  enable_image_search: false
pricing:
  base_cost: 0.0217
  currency: USD

