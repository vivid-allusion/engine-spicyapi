# Wan 3.0 · Image to Video — 9:16
platform: spicyapi
endpoint: alibaba/wan-3.0/image-to-video
media_type: video
image_url_param: image_url
slots: ["last_image_url"]
duration_param_name: duration_seconds
parameters:
  duration_seconds: 5
  enable_prompt_expansion: false
  enable_thinking: false
  generate_audio: true
  resolution: "720p"
  aspect_ratio: "9:16"
pricing:
  cost_per_second: 0.045
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
