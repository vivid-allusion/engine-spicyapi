# Spicy Video Edit 1 — 720P
platform: spicyapi
endpoint: spicy-video-edit-1
media_type: video
image_url_param: video_url
slots: ["reference_image_urls"]
parameters:
  resolution: "720P"
  keep_audio: true
  # Advanced parameters (uncomment to use)
  #aspect_ratio: "16:9"
  #negative_prompt: ""
  #enhance_prompt: false
  #seed: -1
pricing:
  cost_per_second: 0.2
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
