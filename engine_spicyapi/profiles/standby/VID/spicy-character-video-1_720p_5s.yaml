# Spicy Character Video 1 — 720P · 5s
platform: spicyapi
endpoint: spicy-character-video-1
media_type: video
image_url_param: image_url
duration_type: seconds
duration_param_name: duration
slots: ["reference_image_urls"]
parameters:
  resolution: "720P"
  duration: 5
  audio: true
  # Advanced parameters (uncomment to use)
  #character: "chr_..."
  #views: "cv_..."
  #negative_prompt: ""
  #enhance_prompt: false
  #seed: -1
  #fps: 30
pricing:
  cost_per_second: 0.2
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
