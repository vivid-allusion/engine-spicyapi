# Wan 3.0 · Text to Video — 16:9
platform: spicyapi
endpoint: alibaba/wan-3.0/text-to-video
media_type: video
duration_param_name: duration_seconds
parameters:
  resolution: "720p"
  aspect_ratio: "16:9"
  generate_audio: true
  enable_thinking: false
  duration_seconds: 5
  enable_prompt_expansion: false
pricing:
  cost_per_second: 0.045
  currency: USD

