# Spicy Cinema 1 Image — 720P · 5s
platform: spicyapi
endpoint: spicy-cinema-1-image
media_type: video
image_url_param: image_url
duration_type: seconds
duration_param_name: duration
parameters:
  resolution: "720P"
  duration: 5
  audio: true
  # Advanced parameters (uncomment to use)
  #seed: -1
  #fps: 30
pricing:
  cost_per_second: 0.28
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
