# Spicy Cinema 1 Character — 16:9 · 720P · 5s
platform: spicyapi
endpoint: spicy-cinema-1-character
media_type: video
image_url_param: reference_image_urls
duration_type: seconds
duration_param_name: duration
parameters:
  resolution: "720P"
  aspect_ratio: "16:9"
  duration: 5
  audio: true
  # Advanced parameters (uncomment to use)
  #character: "chr_..."
  #views: "cv_..."
  #seed: -1
  #fps: 30
pricing:
  cost_per_second: 0.28
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
