# Spicy Video 1 — 16:9 · 720P · 5s
platform: spicyapi
endpoint: spicy-video-1
media_type: video
duration_type: seconds
duration_param_name: duration
slots: ["audio_url"]
parameters:
  resolution: "720P"
  aspect_ratio: "16:9"
  duration: 5
  audio: true
  # Advanced parameters (uncomment to use)
  #audio_mode: "driving"
  #negative_prompt: ""
  #enhance_prompt: false
  #seed: -1
  #fps: 30
pricing:
  cost_per_second: 0.2
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
