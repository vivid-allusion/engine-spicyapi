# Seedance 2.0 Mini · Image to Video — 16:9
platform: spicyapi
endpoint: bytedance/seedance-2.0-mini/image-to-video
media_type: video
image_url_param: image_url
slots: ["last_image_url"]
duration_param_name: duration_seconds
parameters:
  aspect_ratio: "16:9"
  bitrate_mode: "standard"
  duration_seconds: 5
  enable_web_search: false
  generate_audio: true
  resolution: "720p"
  return_last_frame: false
  watermark: false
pricing:
  cost_per_second: 0.0246078
  currency: USD

# Prompt modifications (uncomment to use)
#prompt_prefix: ''
#prompt_suffix: ''
