id = "spicy-image-reference-1"
label = "Spicy Image Reference 1"
category = "IMG"
platform = "spicyapi"
endpoint = "spicy-image-reference-1"
description = "Takes a picture of your own (`reference_image`) instead of a prompt: it is described in detail and a brand new image is drawn from that description alone, in the picture's shape and style, with its colour balance matched. The picture itself is never edited; one output per call."

[pricing]
base_cost = 0.12
currency = "USD"

[general]
kind = "image"
prompt = "none"
image_url_param = "reference_image"

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
optional = true
hidden = true
description = "Validate and screen the request without generating or charging."

[params.n]
label = "Images per Call"
type = "integer"
default = 1
min = 1
max = 1
optional = true
description = "How many images to return. Billed per delivered image."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
description = "What to avoid. SpicyAPI's safety terms are always appended."

[params.seed]
label = "Seed"
type = "integer"
optional = true
hidden = true
description = "Reuse a seed to reproduce a result. Random when omitted."

[params.user]
label = "End User"
type = "text"
optional = true
hidden = true
description = "Your own opaque id for the end user making this request (up to 128 characters)."
