id = "seedream-5-0-pro-text-to-image"
label = "Seedream 5.0 Pro · Text To Image"
category = "IMG"
platform = "spicyapi"
endpoint = "bytedance/seedream-5.0-pro/text-to-image"
description = "Seedream 5.0 Pro text-to-image is ByteDance's high-detail image model, turning a prompt of up to 5,000 characters into one frame. Choose from fifteen aspect ratios at 1K or 2K, in JPEG or PNG. Uncensored."

[pricing]
base_cost = 0.036
currency = "USD"
note = "$0.036/image; from 1k; 2 tiers"

[general]
kind = "image"
prompt = "required"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "1:1"
options = [
  { value = "1:1", label = "1:1" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "3:2", label = "3:2" },
  { value = "2:3", label = "2:3" },
  { value = "4:5", label = "4:5" },
  { value = "5:4", label = "5:4" },
  { value = "21:9", label = "21:9" },
  { value = "9:21", label = "9:21" },
  { value = "2:1", label = "2:1" },
  { value = "1:2", label = "1:2" },
  { value = "3:1", label = "3:1" },
  { value = "1:3", label = "1:3" },
]
note = "1:1 (the default) or one of fourteen other shapes from 1:3 to 3:1, including 4:5, 21:9 and 9:21. There is no automatic mode on this endpoint — leave it out and the frame comes back square, so name the ratio you are delivering at."

[params.resolution]
label = "Resolution"
type = "select"
default = "2k"
options = [
  { value = "1k", label = "1k" },
  { value = "2k", label = "2k" },
]
affects_price = true
note = "1k or 2k; 2k by default. The tier sets both the pixel count and the price band, so it is not just a sharpness knob."

[params.output_format]
label = "Output Format"
type = "select"
default = "jpeg"
options = [
  { value = "jpeg", label = "jpeg" },
  { value = "png", label = "png" },
]
note = "jpeg by default, or png. png is lossless and the safer handoff into retouching or compositing; it changes the file you receive, not the image that was generated, and not the price."

[params.enable_thinking]
label = "Enable Thinking"
type = "boolean"
default = true
note = "On by default: the model runs a thinking pass that refines your prompt before generating. Switching it off skips that pass, so text-to-image finishes noticeably faster. No effect on price."
