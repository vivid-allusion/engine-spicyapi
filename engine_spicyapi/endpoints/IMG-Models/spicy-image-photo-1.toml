id = "spicy-image-photo-1"
label = "Spicy Image Photo 1"
category = "IMG"
platform = "spicyapi"
endpoint = "spicy-image-photo-1"
description = "Candid, true-to-life photos: natural window and lamp light, real skin texture and phone-camera framing instead of a studio gloss. Renders 1K class stills (1024*1024 to 2048*1152), one to six per call."

[pricing]
base_cost = 0.08
currency = "USD"

[general]
kind = "image"
prompt = "required"

[params.character]
label = "Character"
type = "text"
optional = true
hidden = true
description = "A saved character id (`chr_...`) from `POST /v1/characters`: the same person is rendered in the new scene."
note = "Runs as an edit of the sheet and is billed at the `spicy-image-edit-1` rate."

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
optional = true
hidden = true
description = "Validate and screen the request without generating or charging."

[params.enhance_mode]
label = "Enhance Mode"
type = "select"
default = "direct"
optional = true
options = [
  { value = "direct", label = "Direct · Rewrite the prompt once" },
  { value = "agent",  label = "Agent · Plan the shot, then write" },
]
description = "How the prompt extender works when `enhance_prompt` is true."
note = "A 400 without `enhance_prompt = true`."

[params.enhance_prompt]
label = "Enhance Prompt"
type = "boolean"
default = false
optional = true
description = "Let the model expand the prompt with lighting, camera and detail cues before generating."

[params.n]
label = "Images per Call"
type = "integer"
default = 1
min = 1
max = 6
optional = true
description = "How many images to return. Billed per delivered image."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
description = "What to avoid. SpicyAPI's safety terms are always appended."

[params.seed]
label = "Seed"
type = "integer"
optional = true
hidden = true
description = "Reuse a seed to reproduce a result. Random when omitted."

[params.size]
label = "Size"
type = "select"
default = "1024*1024"
options = [
  { value = "1024*1024", label = "1024*1024 · Square" },
  { value = "832*1216",  label = "832*1216 · Portrait" },
  { value = "1216*832",  label = "1216*832 · Landscape" },
  { value = "1280*1280", label = "1280*1280 · Square · 1.25K" },
  { value = "1440*1440", label = "1440*1440 · Square · 1.4K" },
  { value = "1024*1536", label = "1024*1536 · Portrait" },
  { value = "1536*1024", label = "1536*1024 · Landscape" },
  { value = "1080*1920", label = "1080*1920 · Vertical · 9:16" },
  { value = "1920*1080", label = "1920*1080 · Landscape · 16:9" },
  { value = "1152*2048", label = "1152*2048 · Tall Portrait" },
  { value = "2048*1152", label = "2048*1152 · Wide Landscape" },
]
description = "Output `width*height`, one of the model's documented sizes. Any other value is a 400."

[params.style]
label = "Style"
type = "select"
optional = true
options = [
  { value = "photorealistic", label = "Photorealistic" },
  { value = "studio",         label = "Studio · Warm glamour grade" },
  { value = "anime",          label = "Anime" },
  { value = "3d",             label = "3D" },
  { value = "cartoon",        label = "Cartoon" },
]
description = "An art style id from `GET /v1/styles`. Omit for the model's natural look."

[params.user]
label = "End User"
type = "text"
optional = true
hidden = true
description = "Your own opaque id for the end user making this request (up to 128 characters)."

[params.views]
label = "Character Views"
type = "text"
list = true
optional = true
hidden = true
description = "With `character`: the body view ids to send (`cv_...` from the character's `views`), up to 2."
