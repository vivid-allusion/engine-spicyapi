id = "spicy-image-action-1"
label = "Spicy Image Action 1"
category = "IMG"
platform = "spicyapi"
endpoint = "spicy-image-action-1"
description = "Puts the woman from one of your own generated images into a ready-made explicit still from `GET /v1/images/actions`: her face, hair and skin tone on the still's act, pose, framing, room and body. No prompt; one to four outputs per call."

[pricing]
base_cost = 0.15
currency = "USD"

[general]
kind = "image"
prompt = "none"
image_url_param = "image_url"

[params.action]
label = "Action"
type = "text"
description = "The id of a ready-made explicit still from `GET /v1/images/actions` (e.g. `pov-missionary`). The still supplies the act, pose, framing, room and output size."
note = "id from GET /v1/images/actions"

[params.character]
label = "Character"
type = "text"
optional = true
hidden = true
description = "A saved character id (`chr_...`), alternative to `image_url`: supplies her face, hair and skin tone."

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
optional = true
hidden = true
description = "Validate and screen the request without generating or charging."

[params.n]
label = "Images per Call"
type = "integer"
default = 1
min = 1
max = 4
optional = true
description = "How many images to return. Billed per delivered image."

[params.seed]
label = "Seed"
type = "integer"
optional = true
hidden = true
description = "Reuse a seed to reproduce a result. Random when omitted."

[params.style]
label = "Style"
type = "select"
optional = true
options = [
  { value = "photorealistic", label = "Photorealistic · The photo still" },
  { value = "studio",         label = "Studio · Warm glamour grade" },
  { value = "anime",          label = "Anime · The still's drawn version" },
  { value = "3d",             label = "3D · The still's drawn version" },
  { value = "cartoon",        label = "Cartoon · The still's drawn version" },
]
description = "An art style id from `GET /v1/styles`, matched to her image."
note = "`anime`, `3d` and `cartoon` pick the still's drawn version; omit for the photo."

[params.user]
label = "End User"
type = "text"
optional = true
hidden = true
description = "Your own opaque id for the end user making this request (up to 128 characters)."

[params.views]
label = "Character Views"
type = "text"
list = true
optional = true
hidden = true
description = "With `character`: the body view ids to send (`cv_...` from the character's `views`), up to 2."
