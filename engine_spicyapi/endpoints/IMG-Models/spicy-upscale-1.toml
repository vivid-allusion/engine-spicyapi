id = "spicy-upscale-1"
label = "Spicy Upscale 1"
category = "IMG"
platform = "spicyapi"
endpoint = "spicy-upscale-1"
description = "Restores detail in one of your own generated images at 2x or 4x (4x takes images up to about one megapixel): the picture and person stay the same. Posted to `POST /v1/images/edits`; no prompt, one output per call."

[pricing]
base_cost = 0.02
currency = "USD"
note = "4x is $0.04 per image."

[general]
kind = "image-edit"
prompt = "none"
image_url_param = "image_url"

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
optional = true
hidden = true
description = "Validate and screen the request without generating or charging."

[params.n]
label = "Images per Call"
type = "integer"
default = 1
min = 1
max = 1
optional = true
description = "How many images to return. Billed per delivered image."

[params.scale]
label = "Scale"
type = "integer"
default = 2
min = 2
max = 4
description = "Upscale factor. 4x takes images up to about one megapixel."
note = "2 or 4"

[params.seed]
label = "Seed"
type = "integer"
optional = true
hidden = true
description = "Reproducibility seed. Random when omitted."

[params.user]
label = "End User"
type = "text"
optional = true
hidden = true
description = "Your own opaque id for the end user making this request (up to 128 characters)."

