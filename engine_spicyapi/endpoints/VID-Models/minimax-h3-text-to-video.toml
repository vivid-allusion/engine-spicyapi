id = "minimax-h3-text-to-video"
label = "MiniMax H3 · Text To Video"
category = "VID"
platform = "spicyapi"
endpoint = "minimax/h3/text-to-video"
description = "MiniMax H3 text-to-video turns a written brief into a 5 to 15 second clip with generated audio, at 768p or 2k. Choose from six aspect ratios: 16:9, 9:16, 1:1, 4:3, 3:4 and 21:9."

[pricing]
cost_per_second = 0.037
currency = "USD"
note = "$0.037/second; from 768p; 2 tiers"

[general]
kind = "video"
prompt = "required"
duration_param_name = "duration_seconds"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
  { value = "21:9", label = "21:9" },
]
note = "16:9, 9:16, 1:1, 4:3, 3:4 or 21:9. 21:9 gives the anamorphic letterbox."

[params.resolution]
label = "Resolution"
type = "select"
default = "768p"
options = [
  { value = "768p", label = "768p" },
  { value = "2k", label = "2k" },
]
affects_price = true
note = "768p or 2k, both native. Draft at 768p, deliver at 2k."

[params.duration_seconds]
label = "Duration Seconds"
type = "integer"
default = 5
min = 5
max = 15
affects_price = true
note = "Whole seconds, 5 to 15. Drives the price."

[params.enable_prompt_expansion]
label = "Enable Prompt Expansion"
type = "boolean"
default = false
options = [
  { value = "false", label = "false" },
]
