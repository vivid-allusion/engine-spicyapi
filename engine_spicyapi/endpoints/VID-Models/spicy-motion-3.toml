id = "spicy-motion-3"
label = "Spicy Motion 3"
category = "VID"
platform = "spicyapi"
endpoint = "spicy-motion-3"
description = "Spicy Motion 3: newest-generation video with native dialogue, music and sound effects. Works from a source image or from text alone, up to 30 seconds at 480P to 1080P, with up to 10 reference images, a reference clip and up to 5 reference audio clips."

[pricing]
cost_per_second = 0.2
currency = "USD"
note = "Billed per output second; a reference clip's input seconds are billed too, at the same rate."

[pricing.by_resolution]
"480P" = 0.1
"720P" = 0.2
"1080P" = 0.4

[general]
kind = "video"
prompt = "optional"
image_url_param = "image_url"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["last_frame_url", "reference_image_urls", "video_url", "audio_urls"]

[params.action]
label = "Action"
type = "text"
optional = true
default = ""
note = "id from GET /v1/videos/actions"
description = "A ready-made sex act whose reference clip supplies camera angle, framing, pose and motion; image_url or reference_image_urls supplies the woman."

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "1:1", label = "1:1 · Square" },
  { value = "4:3", label = "4:3 · Classic" },
  { value = "3:4", label = "3:4 · Portrait" },
  { value = "21:9", label = "21:9 · Ultrawide" },
]
note = "Text-to-video only; not accepted with image_url or video_url. With action the default is the action's own shape."

[params.audio]
label = "Generate Audio"
type = "boolean"
default = true
description = "Generate audio where the model supports it."

[params.audio_mode]
label = "Audio Mode"
type = "select"
optional = true
options = [
  { value = "reference", label = "Reference · This model's audio mode" },
]
note = "A mismatch (for example driving) is a 400; omit to use this model's mode."

[params.character]
label = "Character"
type = "text"
optional = true
default = ""
hidden = true
description = "A saved character id (chr_...) to keep the same person."

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
hidden = true
description = "Validate and screen the request without generating or charging."

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = -1
max = 30
description = "Length of the output clip in seconds."
note = "Seconds. -1 lets the model choose the length (debited at the maximum, refunded to the rendered length)."

[params.enhance_prompt]
label = "Enhance Prompt"
type = "boolean"
default = false
description = "Let the model expand the prompt with lighting, camera and detail cues before generating."

[params.fps]
label = "Frame Rate"
type = "select"
default = 30
options = [
  { value = 30, label = "30 fps · Standard" },
  { value = 60, label = "60 fps · Frame-interpolated" },
]
hidden = true
note = "60 frame-interpolates the finished clip for 20% more."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""
description = "What to avoid."
note = "Accepted and ignored — this model has no negative prompt."

[params.resolution]
label = "Resolution"
type = "select"
default = "720P"
options = [
  { value = "480P", label = "480P · Lower cost" },
  { value = "720P", label = "720P · Standard" },
  { value = "1080P", label = "1080P · Full HD" },
]

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
description = "Reuse a seed to reproduce a result."

[params.style]
label = "Art Style"
type = "select"
optional = true
options = [
  { value = "photorealistic", label = "Photorealistic" },
  { value = "studio", label = "Studio · Warm glamour grade" },
  { value = "anime", label = "Anime" },
  { value = "3d", label = "3D" },
  { value = "cartoon", label = "Cartoon" },
]
description = "An art style id from GET /v1/styles; omit for the model's natural look."

[params.user]
label = "End User Id"
type = "text"
optional = true
default = ""
hidden = true
description = "Your own opaque id for the end user making this request."

[params.views]
label = "Character Views"
type = "text"
list = true
optional = true
default = ""
hidden = true
description = "With character: body view ids (cv_...), up to 2, or empty for none."
