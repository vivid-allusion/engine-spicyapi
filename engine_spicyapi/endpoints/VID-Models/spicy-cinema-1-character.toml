id = "spicy-cinema-1-character"
label = "Spicy Cinema 1 Character"
category = "VID"
platform = "spicyapi"
endpoint = "spicy-cinema-1-character"
description = "Spicy Cinema 1 from references: keeps up to 9 people, outfits or props consistent across a new clip. Pass a character or reference images and name them Image 1, Image 2 in the prompt."

[pricing]
cost_per_second = 0.28
currency = "USD"

[pricing.by_resolution]
"480P" = 0.14
"720P" = 0.28
"1080P" = 0.36

[general]
kind = "video"
prompt = "optional"
image_url_param = "reference_image_urls"
duration_type = "seconds"
duration_param_name = "duration"

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "1:1", label = "1:1 · Square" },
  { value = "4:3", label = "4:3 · Classic" },
  { value = "3:4", label = "3:4 · Portrait" },
  { value = "4:5", label = "4:5 · Portrait · Tall" },
  { value = "5:4", label = "5:4 · Landscape · Wide" },
  { value = "9:21", label = "9:21 · Tall Vertical" },
  { value = "21:9", label = "21:9 · Ultrawide" },
]
note = "Text-to-video only; the clip keeps the requested shape."

[params.audio]
label = "Generate Audio"
type = "boolean"
default = true
description = "Generate audio where the model supports it."
note = "Ignored — native audio is always on."

[params.character]
label = "Character"
type = "text"
optional = true
default = ""
hidden = true
description = "A saved character id (chr_...) to keep the same person."

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
hidden = true
description = "Validate and screen the request without generating or charging."

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 3
max = 15
description = "Length of the output clip in seconds."

[params.fps]
label = "Frame Rate"
type = "select"
default = 30
options = [
  { value = 30, label = "30 fps · Standard" },
  { value = 60, label = "60 fps · Frame-interpolated" },
]
hidden = true
note = "60 frame-interpolates the finished clip for 20% more."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""
description = "What to avoid."
note = "Accepted and ignored — this model has no negative prompt."

[params.resolution]
label = "Resolution"
type = "select"
default = "720P"
options = [
  { value = "480P", label = "480P · Lower cost" },
  { value = "720P", label = "720P · Standard" },
  { value = "1080P", label = "1080P · Full HD" },
]

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
description = "Reuse a seed to reproduce a result."

[params.style]
label = "Art Style"
type = "select"
optional = true
options = [
  { value = "photorealistic", label = "Photorealistic" },
  { value = "studio", label = "Studio · Warm glamour grade" },
  { value = "anime", label = "Anime" },
  { value = "3d", label = "3D" },
  { value = "cartoon", label = "Cartoon" },
]
description = "An art style id from GET /v1/styles; omit for the model's natural look."

[params.user]
label = "End User Id"
type = "text"
optional = true
default = ""
hidden = true
description = "Your own opaque id for the end user making this request."

[params.views]
label = "Character Views"
type = "text"
list = true
optional = true
default = ""
hidden = true
description = "With character: body view ids (cv_...), up to 2, or empty for none."
