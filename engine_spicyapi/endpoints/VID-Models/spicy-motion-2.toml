id = "spicy-motion-2"
label = "Spicy Motion 2"
category = "VID"
platform = "spicyapi"
endpoint = "spicy-motion-2"
description = "Latest-generation image-to-video with native audio, up to 1080P and 15 seconds. Takes driving audio (the clip is the soundtrack and the mouth follows it), a closing frame, or a clip to continue."

[pricing]
cost_per_second = 0.2
currency = "USD"

[pricing.by_resolution]
"720P" = 0.2
"1080P" = 0.3

[general]
kind = "video"
prompt = "optional"
image_url_param = "image_url"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["last_frame_url", "video_url", "audio_url"]

[params.audio]
label = "Generate Audio"
type = "boolean"
default = true
description = "Generate audio where the model supports it."

[params.audio_mode]
label = "Audio Mode"
type = "select"
optional = true
options = [
  { value = "driving", label = "Driving · This model's audio mode" },
]
note = "A mismatch (for example reference) is a 400; omit to use this model's mode."

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
hidden = true
description = "Validate and screen the request without generating or charging."

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 2
max = 15
description = "Length of the output clip in seconds."
note = "Whole output length, including a continued clip's seconds."

[params.enhance_prompt]
label = "Enhance Prompt"
type = "boolean"
default = false
description = "Let the model expand the prompt with lighting, camera and detail cues before generating."

[params.fps]
label = "Frame Rate"
type = "select"
default = 30
options = [
  { value = 30, label = "30 fps · Standard" },
  { value = 60, label = "60 fps · Frame-interpolated" },
]
hidden = true
note = "60 frame-interpolates the finished clip for 20% more."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""
description = "What to avoid."

[params.resolution]
label = "Resolution"
type = "select"
default = "720P"
options = [
  { value = "720P", label = "720P · Standard" },
  { value = "1080P", label = "1080P · Full HD" },
]

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
description = "Reuse a seed to reproduce a result."

[params.style]
label = "Art Style"
type = "select"
optional = true
options = [
  { value = "photorealistic", label = "Photorealistic" },
  { value = "studio", label = "Studio · Warm glamour grade" },
  { value = "anime", label = "Anime" },
  { value = "3d", label = "3D" },
  { value = "cartoon", label = "Cartoon" },
]
description = "An art style id from GET /v1/styles; omit for the model's natural look."

[params.user]
label = "End User Id"
type = "text"
optional = true
default = ""
hidden = true
description = "Your own opaque id for the end user making this request."
