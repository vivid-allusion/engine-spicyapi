id = "spicy-cinema-1-edit"
label = "Spicy Cinema 1 Edit"
category = "VID"
platform = "spicyapi"
endpoint = "spicy-cinema-1-edit"
description = "Edit longer clips: 3 to 30 second inputs with up to 5 outfit, prop or style references. The first 15 seconds are edited and returned."

[pricing]
cost_per_second = 0.28
currency = "USD"
note = "Billed per output second; the input clip's seconds are billed too, at the same rate."

[pricing.by_resolution]
"720P" = 0.28
"1080P" = 0.48

[general]
kind = "video-edit"
prompt = "required"
image_url_param = "video_url"
slots = ["reference_image_urls"]

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
hidden = true
description = "Validate and screen the request without generating or charging."

[params.keep_audio]
label = "Keep Audio"
type = "boolean"
default = true
description = "Keep the clip's original soundtrack."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""
description = "What to avoid."

[params.resolution]
label = "Resolution"
type = "select"
default = "720P"
options = [
  { value = "720P", label = "720P · Standard" },
  { value = "1080P", label = "1080P · Full HD" },
]

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
description = "Reuse a seed to reproduce a result."

[params.user]
label = "End User Id"
type = "text"
optional = true
default = ""
hidden = true
description = "Your own opaque id for the end user making this request."
