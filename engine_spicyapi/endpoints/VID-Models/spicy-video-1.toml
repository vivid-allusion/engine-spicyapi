id = "spicy-video-1"
label = "Spicy Video 1"
category = "VID"
platform = "spicyapi"
endpoint = "spicy-video-1"
description = "Text-to-video generation with no source image required, up to 15 seconds at 720P or 1080P. Takes driving audio: the clip becomes the soundtrack and the motion follows it."

[pricing]
cost_per_second = 0.2
currency = "USD"

[pricing.by_resolution]
"720P" = 0.2
"1080P" = 0.3

[general]
kind = "video"
prompt = "optional"
duration_type = "seconds"
duration_param_name = "duration"
slots = ["audio_url"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "1:1", label = "1:1 · Square" },
  { value = "4:3", label = "4:3 · Classic" },
  { value = "3:4", label = "3:4 · Portrait" },
]
note = "Text-to-video only; the clip keeps the requested shape."

[params.audio]
label = "Generate Audio"
type = "boolean"
default = true
description = "Generate audio where the model supports it."

[params.audio_mode]
label = "Audio Mode"
type = "select"
optional = true
options = [
  { value = "driving", label = "Driving · This model's audio mode" },
]
note = "A mismatch (for example reference) is a 400; omit to use this model's mode."

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
hidden = true
description = "Validate and screen the request without generating or charging."

[params.duration]
label = "Duration"
type = "integer"
default = 5
min = 2
max = 15
description = "Length of the output clip in seconds."

[params.enhance_prompt]
label = "Enhance Prompt"
type = "boolean"
default = false
description = "Let the model expand the prompt with lighting, camera and detail cues before generating."

[params.fps]
label = "Frame Rate"
type = "select"
default = 30
options = [
  { value = 30, label = "30 fps · Standard" },
  { value = 60, label = "60 fps · Frame-interpolated" },
]
hidden = true
note = "60 frame-interpolates the finished clip for 20% more."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""
description = "What to avoid."

[params.resolution]
label = "Resolution"
type = "select"
default = "720P"
options = [
  { value = "720P", label = "720P · Standard" },
  { value = "1080P", label = "1080P · Full HD" },
]

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
description = "Reuse a seed to reproduce a result."

[params.style]
label = "Art Style"
type = "select"
optional = true
options = [
  { value = "photorealistic", label = "Photorealistic" },
  { value = "studio", label = "Studio · Warm glamour grade" },
  { value = "anime", label = "Anime" },
  { value = "3d", label = "3D" },
  { value = "cartoon", label = "Cartoon" },
]
description = "An art style id from GET /v1/styles; omit for the model's natural look."

[params.user]
label = "End User Id"
type = "text"
optional = true
default = ""
hidden = true
description = "Your own opaque id for the end user making this request."
