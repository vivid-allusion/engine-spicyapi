id = "spicy-video-edit-1"
label = "Spicy Video Edit 1"
category = "VID"
platform = "spicyapi"
endpoint = "spicy-video-edit-1"
description = "Edit a clip you generated with a prompt: swap the outfit from up to 4 reference images, restyle the scene, change lighting or props. Takes 2 to 10 second clips; the output keeps the clip's length."

[pricing]
cost_per_second = 0.2
currency = "USD"
note = "Billed per output second; the input clip's seconds are billed too, at the same rate."

[pricing.by_resolution]
"720P" = 0.2
"1080P" = 0.3

[general]
kind = "video-edit"
prompt = "required"
image_url_param = "video_url"
slots = ["reference_image_urls"]

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
optional = true
options = [
  { value = "16:9", label = "16:9 · Landscape" },
  { value = "9:16", label = "9:16 · Portrait · Vertical" },
  { value = "1:1", label = "1:1 · Square" },
  { value = "4:3", label = "4:3 · Classic" },
  { value = "3:4", label = "3:4 · Portrait" },
]
note = "Omit to keep the clip's shape."

[params.dry_run]
label = "Dry Run"
type = "boolean"
default = false
hidden = true
description = "Validate and screen the request without generating or charging."

[params.enhance_prompt]
label = "Enhance Prompt"
type = "boolean"
default = false
description = "Let the model expand the prompt with lighting, camera and detail cues before generating."

[params.keep_audio]
label = "Keep Audio"
type = "boolean"
default = true
description = "Keep the clip's original soundtrack."

[params.negative_prompt]
label = "Negative Prompt"
type = "text"
optional = true
default = ""
description = "What to avoid."

[params.resolution]
label = "Resolution"
type = "select"
default = "720P"
options = [
  { value = "720P", label = "720P · Standard" },
  { value = "1080P", label = "1080P · Full HD" },
]

[params.seed]
label = "Random Seed"
type = "integer"
default = -1
min = -1
max = 2147483647
optional = true
hidden = true
description = "Reuse a seed to reproduce a result."

[params.user]
label = "End User Id"
type = "text"
optional = true
default = ""
hidden = true
description = "Your own opaque id for the end user making this request."
