id = "wan-3-0-reference-to-video"
label = "Wan 3.0 · Reference To Video"
category = "VID"
platform = "spicyapi"
endpoint = "alibaba/wan-3.0/reference-to-video"
description = "Alibaba's Wan 3.0 reference-to-video keeps identity, wardrobe, location or voice consistent using up to 10 images, 5 videos and 5 audio files. It returns 2 to 30 seconds at 480p to 1080p, and the prompt is optional."

[pricing]
cost_per_second = 0.045
currency = "USD"
note = "$0.045/second; from 480p; 3 tiers"

[general]
kind = "video"
prompt = "optional"
image_url_param = "reference_image_urls"
slots = ["reference_video_urls", "reference_audio_urls", "reference_file_url"]
media_lists = ["reference_audio_urls", "reference_image_urls", "reference_video_urls"]
duration_param_name = "duration_seconds"

[params.reference_link_url]
label = "Reference Link Url"
type = "text"
note = "One public web page the model reads for reference, such as an article, a product page or a character profile. It must open without a login. Some sites refuse automated readers, and a page with too little text cannot be used; in both cases the task fails with a message saying the URL could not be read, and failed tasks are not charged. Not together with reference_file_url; if enable_prompt_expansion is left unset, attaching a link also switches it on. Links are not billed."

[params.aspect_ratio]
label = "Aspect Ratio"
type = "select"
default = "16:9"
options = [
  { value = "16:9", label = "16:9" },
  { value = "9:16", label = "9:16" },
  { value = "1:1", label = "1:1" },
  { value = "4:3", label = "4:3" },
  { value = "3:4", label = "3:4" },
  { value = "adaptive", label = "adaptive" },
]
note = "16:9, 9:16, 1:1, 4:3, 3:4 or adaptive, which lets the model choose. Defaults to 16:9."

[params.enable_thinking]
label = "Enable Thinking"
type = "boolean"
default = false
note = "Has the model think through the brief and any reference material before generating. It helps with dense documents, web pages and complex reference images, and makes the run slower. Off by default; it switches on automatically when you pass a reference file or link. It does not change the price."

[params.resolution]
label = "Resolution"
type = "select"
default = "720p"
options = [
  { value = "480p", label = "480p" },
  { value = "720p", label = "720p" },
  { value = "1080p", label = "1080p" },
]
affects_price = true
note = "480p, 720p or 1080p. Defaults to 720p. Resolution changes both the price and how long the task takes to come back."

[params.duration_seconds]
label = "Duration Seconds"
type = "integer"
default = 5
options = [
  { value = "-1", label = "Smart" },
  { value = "2", label = "2" },
  { value = "3", label = "3" },
  { value = "4", label = "4" },
  { value = "5", label = "5" },
  { value = "6", label = "6" },
  { value = "7", label = "7" },
  { value = "8", label = "8" },
  { value = "9", label = "9" },
  { value = "10", label = "10" },
  { value = "11", label = "11" },
  { value = "12", label = "12" },
  { value = "13", label = "13" },
  { value = "14", label = "14" },
  { value = "15", label = "15" },
  { value = "16", label = "16" },
  { value = "17", label = "17" },
  { value = "18", label = "18" },
  { value = "19", label = "19" },
  { value = "20", label = "20" },
  { value = "21", label = "21" },
  { value = "22", label = "22" },
  { value = "23", label = "23" },
  { value = "24", label = "24" },
  { value = "25", label = "25" },
  { value = "26", label = "26" },
  { value = "27", label = "27" },
  { value = "28", label = "28" },
  { value = "29", label = "29" },
  { value = "30", label = "30" },
]
affects_price = true
note = "Any whole number from 2 to 30, or -1 for smart duration. Defaults to 5. With reference videos, their total length plus this value must stay within 30 seconds, and those seconds are billed on top of the output. Settle the look at 5 seconds before extending."

[params.generate_audio]
label = "Generate Audio"
type = "boolean"
default = true
note = "On by default. The clip comes back with sound already locked to the picture. Set false when you are scoring the shot yourself."

[params.enable_prompt_expansion]
label = "Enable Prompt Expansion"
type = "boolean"
note = "Off by default. When on, the prompt is rewritten before generation, which helps thin briefs and fights you on detailed ones. If you leave it unset and attach reference_file_url or reference_link_url, it is switched on for that request, because the document or page is read in this step. Set it to false explicitly and the file or page is still read, without the prompt rewrite."

[params.seed]
label = "Seed"
type = "integer"
min = 0
max = 2147483647
note = "0 to 2147483647. Hold it steady to compare one changed field at a time; drop it for variety."
